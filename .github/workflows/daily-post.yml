name: Daily Blog Post Generation

on:
  schedule:
    # UTC 00:00 = KST 09:00, 홀숫날(1,3,5…31)에만 실행 = 이틀에 한 번 (2026-08-09 변경)
    # 31일까지 있는 달은 31일→1일이 하루 간격이 된다. 주 단위로는 3~4회.
    - cron: '0 0 */2 * *'
  workflow_dispatch:          # 수동 실행 가능

# telegram-inbox와 같은 그룹. 둘 다 products.json을 커밋하므로 겹치면 푸시가 깨진다
concurrency:
  group: products-json
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # products.json 커밋 권한
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Generate post (attempt 1)
        id: attempt1
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: 득템로그
        run: npm run generate
      - name: Wait before retry
        if: steps.attempt1.outcome == 'failure'
        run: sleep 120
      - name: Generate post (attempt 2 - retry)
        if: steps.attempt1.outcome == 'failure'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SITE_NAME: 득템로그
        run: npm run generate
      - name: Commit updated products.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/products.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: mark published product as used [skip ci]"
            # 사이에 inbox가 상품을 등록했으면 non-fast-forward로 막힌다 → rebase 후 재시도
            git push || { git pull --rebase origin main && git push; }
          fi
